[package]
name = "pigeons"
description = "carrier pigeons for your SSH connections"
license = "MIT"
authors = ["b5 sparkle_pony_2000@gmail.com", "Zacharias Boehler <rustonbsd@mailfence.com>"]
repository = "https://github.com/rustonbsd/pigeons"
readme = "README.md"
keywords = ["networking"]
categories = ["network-programming"]
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1.0.102"
iroh = "1.0.0-rc.0"
ed25519-dalek = { version = "2.2.0", features = ["rand_core"] }
rand = "0.10.1"
tokio-stream = { version = "0.1.18", features = ["sync"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["fmt", "ansi", "env-filter"] }
tracing-appender = "0.2.5"
tokio = { version = "1.52.3", features = [
    "signal",
    "macros",
    "io-util",
    "sync",
    "rt",
] }
clap = { version = "4.6.1", features = ["derive"] }
homedir = "0.3.6"
whoami = "2.1.2"
z32 = "1.3"
tempfile = "3.27.0"
self-runas = "0.1"
iroh-services = "1.0.0-rc.0"

[target.'cfg(target_os = "linux")'.dependencies]
iroh-updater = { path = "../iroh-updater", features = ["applier-systemd"] }
iroh-blobs = "0.101"

[target.'cfg(windows)'.dependencies.windows-service]
version = "0.8.1"
[target.'cfg(windows)'.dependencies.windows-sys]
version = "0.61.2"
features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_Security_Authorization",
    "Win32_Storage_FileSystem",
    "Win32_System_Power",
    "Win32_System_RemoteDesktop",
    "Win32_System_Services",
    "Win32_System_SystemServices",
    "Win32_System_Threading",
    "Win32_System_WindowsProgramming",
    "Win32_UI_WindowsAndMessaging",
]
[profile.release]
opt-level = 3
lto = true
panic = "abort"
